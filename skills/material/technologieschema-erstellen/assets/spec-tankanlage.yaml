# Muster: Tankanlage – Behälter mit Füllstand, Rohre mit Ventilen und Pumpe, Förderband, Bedienfeld.
# Ausgangspunkt für Anlagen mit Flüssigkeiten. Rohre enden über Anker an den Bauteilen
# ("-QM1@links"); Zwischenpunkte als [x, y]. Das Band ist nicht gekennzeichnet (kein Betriebsmittel
# der Steuerung), sein Motor schon.
titel: "Abbildung 2 – Technologieschema der Tankanlage"
alt: "Tank mit drei Füllstandsschaltern -BL1 bis -BL3 an der linken Wand; der Zulauf führt über Ventil -QM1 und Pumpe -GP1 von rechts oben in den Tank, der Ablauf unten über Ventil -QM2. Rechts davon ein Bedienfeld mit Taster -SJ1 und Leuchtmelder -PF1 sowie ein Abtransportband mit Motor -MA1."
out: abbildungen/46_tankanlage
breite: 760
hoehe: 470
fusszeile:
  - "Grundstellung: Füllstand zwischen -BL1 und -BL2, Ventile geschlossen, Pumpe und Band aus."
elemente:
  - {typ: behaelter, ref: tank, x: 250, y: 150, b: 200, h: 220, fuellstand: 0.45}
  - {typ: sensor, art: kontakt, id: "-BL1", name: unten, x: 250, y: 330, stiel: links, lage: links, funktion: "meldet: Tank nicht leer"}
  - {typ: sensor, art: kontakt, id: "-BL2", name: mittel, x: 250, y: 250, stiel: links, lage: links, funktion: "meldet: Tank halb voll"}
  - {typ: sensor, art: kontakt, id: "-BL3", name: oben, x: 250, y: 180, stiel: links, lage: links, funktion: "meldet: Tank voll"}
  - {typ: pumpe, id: "-GP1", name: Zulaufpumpe, funktion: "fördert Wasser in den Tank", x: 550, y: 70, richtung: links}
  - {typ: ventil, id: "-QM1", name: Zulaufventil, funktion: "gibt den Zulauf frei", x: 400, y: 70, achse: waagerecht, spule: oben}
  - {typ: rohr, punkte: ["-GP1@rechts", [730, 70]], weite: 12}
  - {typ: rohr, punkte: ["-GP1@links", "-QM1@rechts"], weite: 12}
  - {typ: rohr, punkte: ["-QM1@links", [350, 70], [350, 200]], weite: 12}
  - {typ: ventil, id: "-QM2", name: Ablaufventil, funktion: "gibt den Ablauf frei", x: 350, y: 410, lage: links}
  - {typ: rohr, punkte: [[350, 370], "-QM2@oben"], weite: 12}
  - {typ: rohr, punkte: ["-QM2@unten", [350, 455]], weite: 12}
  - typ: bedienfeld
    x: 540
    y: 190
    b: 170
    h: 90
    titel: Bedienfeld
    spalten: 2
    eintraege:
      - {typ: taster, id: "-SJ1", name: Start, funktion: "startet das Befüllen"}
      - {typ: leuchte, id: "-PF1", name: Betrieb, funktion: "leuchtet während des Befüllens"}
  - {typ: band, x: 520, y: 340, b: 190, h: 28, winkel: -12, lage: oben, name: Abtransportband}
  - {typ: motor, id: "-MA1", name: Bandantrieb, x: 640, y: 425, r: 22, funktion: "treibt das Abtransportband an"}
