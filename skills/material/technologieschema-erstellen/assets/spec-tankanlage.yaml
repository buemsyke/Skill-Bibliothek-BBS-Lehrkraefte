# Muster: Tankanlage – Behälter mit Füllstand, Rohre mit Ventilen und Pumpe, Förderband, Bedienfeld.
# Ausgangspunkt für Anlagen mit Flüssigkeiten. Rohre enden über Anker an den Bauteilen
# ("-Q1@links"); Zwischenpunkte als [x, y]. Das Band ist nicht gekennzeichnet (kein Betriebsmittel
# der Steuerung), sein Motor schon.
titel: "Abbildung 2 – Technologieschema der Tankanlage"
alt: "Tank mit drei Füllstandsschaltern -B1 bis -B3 an der linken Wand; der Zulauf führt über Ventil -Q1 und Pumpe -G1 von rechts oben in den Tank, der Ablauf unten über Ventil -Q2. Rechts davon ein Bedienfeld mit Taster -S1 und Leuchtmelder -P1 sowie ein Abtransportband mit Motor -M1."
out: abbildungen/46_tankanlage
breite: 760
hoehe: 470
fusszeile:
  - "Grundstellung: Füllstand zwischen -B1 und -B2, Ventile geschlossen, Pumpe und Band aus."
elemente:
  - {typ: behaelter, ref: tank, x: 250, y: 150, b: 200, h: 220, fuellstand: 0.45}
  - {typ: sensor, art: kontakt, id: "-B1", name: unten, x: 250, y: 330, stiel: links, lage: links, funktion: "meldet: Tank nicht leer"}
  - {typ: sensor, art: kontakt, id: "-B2", name: mittel, x: 250, y: 250, stiel: links, lage: links, funktion: "meldet: Tank halb voll"}
  - {typ: sensor, art: kontakt, id: "-B3", name: oben, x: 250, y: 180, stiel: links, lage: links, funktion: "meldet: Tank voll"}
  - {typ: pumpe, id: "-G1", name: Zulaufpumpe, funktion: "fördert Wasser in den Tank", x: 550, y: 70, richtung: links}
  - {typ: ventil, id: "-Q1", name: Zulaufventil, funktion: "gibt den Zulauf frei", x: 400, y: 70, achse: waagerecht, spule: oben}
  - {typ: rohr, punkte: ["-G1@rechts", [730, 70]], weite: 12}
  - {typ: rohr, punkte: ["-G1@links", "-Q1@rechts"], weite: 12}
  - {typ: rohr, punkte: ["-Q1@links", [350, 70], [350, 200]], weite: 12}
  - {typ: ventil, id: "-Q2", name: Ablaufventil, funktion: "gibt den Ablauf frei", x: 350, y: 410, lage: links}
  - {typ: rohr, punkte: [[350, 370], "-Q2@oben"], weite: 12}
  - {typ: rohr, punkte: ["-Q2@unten", [350, 455]], weite: 12}
  - typ: bedienfeld
    x: 540
    y: 190
    b: 170
    h: 90
    titel: Bedienfeld
    spalten: 2
    eintraege:
      - {typ: taster, id: "-S1", name: Start, funktion: "startet das Befüllen"}
      - {typ: leuchte, id: "-P1", name: Betrieb, funktion: "leuchtet während des Befüllens"}
  - {typ: band, x: 520, y: 340, b: 190, h: 28, winkel: -12, lage: oben, name: Abtransportband}
  - {typ: motor, id: "-M1", name: Bandantrieb, x: 640, y: 425, r: 22, funktion: "treibt das Abtransportband an"}
