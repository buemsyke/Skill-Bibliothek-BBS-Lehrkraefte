# Muster: Näherungsschalter an Relais – Schließer mit Magnetbetätigung (Zylinderschalter) und Öffner.
# Zeigt Näherungsschalter nach DIN EN 60617 (Teil 7), Anschlusspunkte und rechtwinklige Linien.
# Kennzeichen: Sensoren -B1, -B2 (Klasse B, eine Art), Relais -K1, -K2 (Klasse K).
titel: "Abbildung 5 – Anschluss zweier Näherungsschalter an Relais"
alt: "Zwischen +24 V und 0 V zwei Zweige: Näherungsschalter -B1 als Schließer mit Magnetbetätigung in Reihe mit Relais -K1 und Näherungsschalter -B2 als Öffner in Reihe mit Relais -K2."
out: abbildungen/46_naeherungsschalter
breite: 480
hoehe: 380
fusszeile:
  - "Grundstellung: Magnet nicht in der Nähe von -B1, kein Metall vor -B2."
  - "Schaltzeichen: DIN EN 60617; Kennzeichen: DIN EN IEC 81346-2:2020."
elemente:
  - {typ: linie, punkte: [[60, 50], [400, 50]], stil: dick}
  - {typ: text, x: 60, y: 40, text: "+24 V", groesse: 12, fett: true}
  - {typ: linie, punkte: [[60, 350], [400, 350]], stil: dick}
  - {typ: text, x: 60, y: 370, text: "0 V", groesse: 12, fett: true}
  - {typ: symbol, symbol: naeherungsschalter_magnet_schliesser, id: "-B1", name: Endlage, funktion: "meldet 1, wenn der Magnet des Zylinders vor dem Sensor steht", x: 200, y: 120, lage: links}
  - {typ: symbol, symbol: spule, id: "-K1", name: Relais, funktion: "zieht an, solange -B1 schließt", x: 200, y: 250, lage: links}
  - {typ: symbol, symbol: naeherungsschalter_oeffner, id: "-B2", name: Wächter, funktion: "meldet 0, sobald Metall vor dem Sensor steht", x: 340, y: 120, lage: rechts}
  - {typ: symbol, symbol: spule, id: "-K2", name: Relais, funktion: "zieht an, solange -B2 nicht betätigt ist", x: 340, y: 250, lage: rechts}
  - {typ: linie, punkte: [[200, 50], "-B1@an1"]}
  - {typ: linie, punkte: ["-B1@an2", "-K1@an1"]}
  - {typ: linie, punkte: ["-K1@an2", [200, 350]]}
  - {typ: linie, punkte: [[340, 50], "-B2@an1"]}
  - {typ: linie, punkte: ["-B2@an2", "-K2@an1"]}
  - {typ: linie, punkte: ["-K2@an2", [340, 350]]}
