# Symboltafel GRAFCET nach DIN EN 60848 – alle Symbole aus Einzelteilen mit festen Koordinaten.
# Einzelteile: grafcet_schritt, grafcet_transition, grafcet_balken, grafcet_rahmen (x = Mitte, y = Oberkante,
# bei der Transition y = Mitte des Querstrichs). Für ganze Ketten immer typ: grafcet nehmen.
