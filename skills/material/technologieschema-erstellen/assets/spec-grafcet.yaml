# Muster GRAFCET (typ: grafcet, Abschn. 5a der Spec-Referenz) – Tankanlage aus spec-tankanlage.yaml.
# Die Spec nennt nur die Struktur; Lage und Normsymbole kommen aus dem Werkzeug. Kopieren nach
# schema/…_loesung_<nr>_grafcet.yaml. breite und hoehe dürfen fehlen (werden berechnet).
# Speichernd: "↑ -P1 := 1" (bei Aktivierung), "↓ -P1 := 0" (bei Deaktivierung) – immer mit Zuweisung.
titel: "Lösung – GRAFCET der Tankanlage"
alt: "GRAFCET mit Initialschritt 0 und den Schritten 1 bis 3; Schritt 1 setzt -P1 bei Aktivierung und steuert -Q1 und -G1; Schritt 3 steuert -Q2 und setzt -P1 bei Deaktivierung zurück; Transitionen -S1 · nicht -B3, -B3, 30s/X2 und nicht -B1; Rücksprung zum Initialschritt."
out: abbildungen/46_tankanlage_loesung_grafcet
fusszeile:
  - "GRAFCET nach DIN EN 60848, Schreibweise nach dem Notationsblatt."
  - "Lösungsbild – nur Lehrerteil."
elemente:
  - typ: grafcet
    zuordnung:             # optional: nur diese Kennzeichen, nichts vergessen
      eingaenge: ["-S1", "-B1", "-B3"]
      ausgaenge: ["-Q1", "-Q2", "-G1", "-P1"]
    kette:
      - {schritt: 0, art: initial}
      - {transition: "-S1 · ¬-B3", kommentar: "Start, Tank nicht voll"}
      - schritt: 1
        aktionen: ["↑ -P1 := 1", "-Q1", {text: "-G1", kommentar: "Befüllen"}]
      - {transition: "-B3", kommentar: "Tank voll"}
      - {schritt: 2, kommentar: "Beruhigen"}
      - {transition: "30s/X2"}
      - schritt: 3
        aktionen: [{text: "-Q2", kommentar: "Entleeren"}, "↓ -P1 := 0"]
      - {transition: "¬-B1", kommentar: "Tank leer"}
      - sprung: 0
