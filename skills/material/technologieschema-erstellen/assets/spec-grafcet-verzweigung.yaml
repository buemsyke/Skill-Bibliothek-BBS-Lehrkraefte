# Muster GRAFCET mit Parallel- und Alternativverzweigung, allen Aktionsarten und Zähler
# (erfundene Spülstation, Kennzeichen wie im Notationsblatt).
# Alternative: jeder Ast beginnt mit seiner Transition; ein Ast darf mit "sprung" enden.
# Parallel: unter der gemeinsamen Transition, jeder Ast beginnt und endet mit einem Schritt.
titel: "GRAFCET der Spülstation"
alt: "GRAFCET mit Initialschritt 0; Einfahren in Schritt 1; parallel Sprühen und Nachspülen in den Schritten 2 bis 4 sowie Bürsten in den Schritten 5 und 6; danach Ausfahren mit Zähler in Schritt 7 und Alternative: unter drei Teilen zurück zu Schritt 1, sonst Filtermeldung in Schritt 8 und zurück zum Initialschritt."
out: abbildungen/46_spuelstation_grafcet
fusszeile:
  - "GRAFCET nach DIN EN 60848, Schreibweise nach dem Notationsblatt. Erfundene Anlage."
elemente:
  - typ: grafcet
    kette:
      - schritt: 0
        art: initial
        aktionen: ["↑ C_Teile := 0", "↑ M_Fehler := 0", {text: "-PF1", kommentar: "Bereit"}]
      - {transition: "-SJ1 · -BG1", kommentar: "Start, Werkstück vorhanden"}
      - schritt: 1
        aktionen: [{text: "-MA1", kommentar: "Werkstück einfahren"}]
      - {transition: "-BG2", kommentar: "Werkstück in der Kammer"}
      - parallel:
          - - schritt: 2
                # Zuweisungsbedingung: nur solange die Düse frei ist
              aktionen: [{text: "-QM1", bedingung: "-BP3", kommentar: "Sprühen, solange die Düse frei ist"}]
            - {transition: "20s/X2"}
            - schritt: 3
                # zeitbegrenzt: höchstens 5 s nach Aktivierung; Ereignis: Fehler bei steigender Flanke merken
              aktionen:
                - [{text: "-QM2", art: zeitbegrenzt, bedingung: "5s/X3", kommentar: "höchstens 5 s nachspülen"}]
                - [{text: "M_Fehler := 1", art: ereignis, bedingung: "↑-BP4", kommentar: "Druckfehler merken"}]
            - {transition: "8s/X3"}
            - {schritt: 4}
          - - schritt: 5
                # verzögert: Bürste läuft 2 s nach Aktivierung an
              aktionen: [{text: "-MA2", art: verzoegert, bedingung: "2s/X5", kommentar: "Bürste läuft verzögert an"}]
            - {transition: "25s/X5"}
            - {schritt: 6}
      - {transition: 1}
      - schritt: 7
        aktionen: ["↑ C_Teile := C_Teile + 1", {text: "-MA3", kommentar: "Werkstück ausfahren"}]
      - alternativ:
          - - {transition: "-BG5 · [C_Teile < 3]", kommentar: "ausgefahren, weitere Teile"}
            - sprung: 1
          - - {transition: "-BG5 · [C_Teile = 3]", kommentar: "ausgefahren, drittes Teil"}
            - schritt: 8
              aktionen: [{text: "-PF2", kommentar: "Filter wechseln"}]
            - {transition: "-SJ2", kommentar: "quittiert"}
            - sprung: 0
